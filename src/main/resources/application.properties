spring.application.name=mini-ecommerce-oms
server.port=8080

# SQLite database file, relative to the directory the app is started from.
# foreign_keys=on is required: SQLite does not enforce foreign keys by default.
spring.datasource.url=jdbc:sqlite:data/shop.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows only one writer at a time. A single pooled connection
# serialises all database work, so concurrent orders cannot interleave.
spring.datasource.hikari.maximum-pool-size=1

# Run schema.sql on every startup (it only uses CREATE ... IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql