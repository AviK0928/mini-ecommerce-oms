spring.application.name=mini-ecommerce-oms

# Load local settings from backend/.env if it exists (see .env.example).
# Real OS environment variables override values from .env.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# SQLite database file, relative to the backend folder unless absolute.
# foreign_keys=on is required: SQLite does not enforce foreign keys by default.
app.db-path=${DB_PATH:data/shop.db}
spring.datasource.url=jdbc:sqlite:${app.db-path}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows only one writer at a time. A single pooled connection
# serialises all database work, so concurrent orders cannot interleave.
spring.datasource.hikari.maximum-pool-size=1

# Run schema.sql on every startup (it only uses CREATE ... IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Browser origins allowed to call /api/** (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Reject decimal values for integer fields (e.g. quantity 3.5) instead of truncating them.
spring.jackson.deserialization.accept-float-as-int=false